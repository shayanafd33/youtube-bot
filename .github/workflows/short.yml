name: Short

on:
  schedule:
    - cron: "0 1 * * *"   # daily, 01:00 UTC (GitHub may start it a few minutes late)
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write          # needed to commit schedule.json back

concurrency:
  group: short
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build and upload Short
        run: python src/short.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      - name: Save schedule progress
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || (git commit -m "Update schedule" && git push)
