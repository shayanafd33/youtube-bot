name: Daily Short Film

on:
  schedule:
    - cron: "0 4 * * *"   # builds daily at 04:00 UTC; the POST time is set in config.json
  workflow_dispatch:       # manual "Run workflow" button
    inputs:
      dry_run:
        description: "Test run: build the video and download it, but do NOT post anything"
        type: boolean
        default: true

permissions:
  contents: write          # needed for GitHub Releases and saving state

concurrency:
  group: daily-film
  cancel-in-progress: false

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages (ffmpeg, espeak-ng, subtitle fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg espeak-ng fonts-liberation fonts-noto-cjk

      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-model-v1

      - name: Python packages (PyTorch CPU build first)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Make and schedule the film
        run: python src/main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      - name: Keep the test video for download (test runs only)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: test-film
          path: work/film-*.mp4
          retention-days: 3

      - name: Save progress
        if: success()
        run: |
          git config user.name "film-bot"
          git config user.email "film-bot@users.noreply.github.com"
          git add state/state.json
          git diff --staged --quiet || (git commit -m "Update state" && git push)
